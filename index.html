<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10110f" />
    <title>mori — 今日を整える</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="mori ホーム">
          <span class="brand-mark" aria-hidden="true"><span></span></span>
          <span>mori</span>
        </a>
        <div class="topbar-right">
          <span class="date-label">SATURDAY, NOV 15</span>
          <button class="avatar" aria-label="プロフィール">R</button>
        </div>
      </header>

      <main class="main-content">
        <section class="intro" aria-labelledby="page-title">
          <div class="eyebrow"><span class="status-dot"></span> YOUR SPACE, AT YOUR PACE</div>
          <h1 id="page-title">今日を、<span>整える。</span></h1>
          <p>ひとつずつで大丈夫。今日のあなたにできることから。</p>
        </section>

        <form class="task-composer" action="#" role="search">
          <span class="composer-plus" aria-hidden="true">＋</span>
          <label class="visually-hidden" for="new-task">次のタスクを入力</label>
          <input id="new-task" type="text" placeholder="次のタスクを入力…" />
          <button type="button" class="add-button">追加 <span aria-hidden="true">↵</span></button>
        </form>

        <section class="task-section" aria-labelledby="tasks-title">
          <div class="section-heading">
            <div>
              <h2 id="tasks-title">今日のタスク</h2>
              <p>小さな一歩を、積み重ねよう。</p>
            </div>
            <span class="task-count"><strong>03</strong> / 05</span>
          </div>

          <div class="task-list">
            <label class="task-row">
              <input type="checkbox" />
              <span class="checkmark" aria-hidden="true"></span>
              <span class="task-name">企画書の構成をまとめる</span>
              <span class="task-time">午前中</span>
              <span class="more" aria-hidden="true">···</span>
            </label>
            <label class="task-row">
              <input type="checkbox" />
              <span class="checkmark" aria-hidden="true"></span>
              <span class="task-name">デザインレビューを確認</span>
              <span class="task-time">14:00</span>
              <span class="more" aria-hidden="true">···</span>
            </label>
            <label class="task-row">
              <input type="checkbox" />
              <span class="checkmark" aria-hidden="true"></span>
              <span class="task-name">週次ミーティングの準備</span>
              <span class="task-time">16:30</span>
              <span class="more" aria-hidden="true">···</span>
            </label>
          </div>

          <button class="completed-toggle" type="button"><span class="completed-icon">✓</span> 完了したタスク <span class="completed-count">2</span><span class="chevron">⌄</span></button>
        </section>
      </main>

      <footer class="footer-note"><span class="footer-sparkle">✳</span> 自分のペースで進もう</footer>

      <aside class="mascot" aria-label="モリ。あなたの一日をそっと応援するキャラクター">
        <div class="mascot-speech">いいペース！</div>
        <svg class="mori" viewBox="0 0 120 130" role="img" aria-label="葉っぱの耳を持つ緑の小さなキャラクター">
          <ellipse cx="61" cy="119" rx="37" ry="6" fill="#000" opacity=".25" />
          <path d="M34 36C27 25 30 12 40 8c9 8 12 18 8 29" fill="#7da96e" />
          <path d="M43 33c-1-11 6-21 18-23 4 11 0 22-10 29" fill="#a1c88d" />
          <path d="M74 34c2-13 12-21 23-19 1 12-5 22-17 27" fill="#7da96e" />
          <path d="M43 31c5 8 10 13 16 17M83 33c-5 7-10 12-16 16" fill="none" stroke="#c7dda5" stroke-width="2" stroke-linecap="round" opacity=".7" />
          <path d="M24 70c0-27 16-43 38-43 23 0 39 17 39 44 0 25-15 40-39 40-23 0-38-15-38-41Z" fill="#5f8057" />
          <path d="M32 70c0-21 12-34 30-34 18 0 31 14 31 35 0 20-12 32-31 32-18 0-30-12-30-33Z" fill="#799b68" />
          <ellipse cx="49" cy="72" rx="2.7" ry="3.5" fill="#172118" />
          <ellipse cx="75" cy="72" rx="2.7" ry="3.5" fill="#172118" />
          <path d="M56 82c3 4 8 4 12 0" fill="none" stroke="#314632" stroke-width="2" stroke-linecap="round" />
          <circle cx="41" cy="80" r="4" fill="#d4a590" opacity=".65" />
          <circle cx="83" cy="80" r="4" fill="#d4a590" opacity=".65" />
          <path d="M24 83c-7-1-11 3-12 8 7 3 13 1 17-4M99 83c7-1 11 3 12 8-7 3-13 1-17-4" fill="#66895e" />
          <path d="M48 109v4M76 109v4" stroke="#405d3d" stroke-width="3" stroke-linecap="round" />
        </svg>
        <span class="mascot-name">mori</span>
      </aside>
    </div>
  </body>
</html>
